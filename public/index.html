<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Yes I Do · L'application</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#141210; --muted:#6B655E; --line:#E6E1DA; --cream:#FAF7F2; --gold:#B8956A; --ok:#3F6B4E; --warn:#9B6A2E; --bad:#9B3B2E; --bg:#fff; --btn:#141210; --btnink:#fff;
         --pill-ok:#E6EFE8; --pill-warn:#F5ECDD; --pill-bad:#F3E3E0; --pill-gold:#F3EADF; --pill-goldink:#7d5f3b;
         --h:"Cormorant Garamond",Georgia,serif; --b:"Inter",system-ui,sans-serif; }
  :root[data-theme="sombre"]{ --ink:#F2EEE8; --muted:#A39B91; --line:#2E2A26; --cream:#1E1B18; --gold:#C9A878; --ok:#8FBF9B; --warn:#D9A866; --bad:#E08A7E; --bg:#141210; --btn:#F2EEE8; --btnink:#141210;
         --pill-ok:#1F3326; --pill-warn:#3A2B17; --pill-bad:#3A1F1B; --pill-gold:#332A1F; --pill-goldink:#D9C2A0; color-scheme:dark; }
  *{ box-sizing:border-box } body{ margin:0; background:var(--bg); color:var(--ink); font:400 15px/1.55 var(--b); }
  header{ display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between; padding:18px 28px; border-bottom:1px solid var(--line); }
  header h1{ margin:0; font:500 24px/1.1 var(--h); letter-spacing:.08em; text-transform:uppercase; }
  header small{ display:block; font:500 11px/1 var(--b); letter-spacing:.2em; color:var(--gold); text-transform:uppercase; margin-bottom:6px; }
  header img{ height:44px; width:auto; }
  nav a{ font:500 11px/1 var(--b); letter-spacing:.14em; text-transform:uppercase; color:var(--ink); text-decoration:none; padding:10px 16px; border:1px solid var(--line); border-radius:999px; margin-left:6px; }
  nav a.on{ background:var(--btn); color:var(--btnink); border-color:var(--btn); }
  main{ max-width:1180px; margin:0 auto; padding:26px 28px 60px; }
  .login{ max-width:420px; margin:60px auto; display:grid; gap:14px; text-align:center; }
  .login h2{ margin:0; font:500 30px/1.1 var(--h); letter-spacing:.08em; text-transform:uppercase; }
  input, select, textarea{ width:100%; min-height:46px; padding:11px 14px; border:1px solid var(--line); border-radius:12px; font:400 15px/1.4 var(--b); color:var(--ink); background:var(--bg); }
  textarea{ min-height:120px; }
  textarea.mono{ min-height:180px; font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  button{ min-height:44px; padding:10px 20px; border-radius:999px; border:1px solid var(--btn); background:var(--btn); color:var(--btnink); font:500 12px/1 var(--b); letter-spacing:.12em; text-transform:uppercase; cursor:pointer; }
  button.ghost{ background:var(--bg); color:var(--ink); border-color:var(--line); } button.ghost:hover{ border-color:var(--ink); }
  button[disabled]{ opacity:.5; cursor:default; }
  h2.sec{ margin:0 0 6px; font:500 22px/1.2 var(--h); letter-spacing:.06em; text-transform:uppercase; }
  .lead{ color:var(--muted); margin:0 0 16px; }
  .card{ border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:16px; } .card h3{ margin:0 0 8px; font:600 20px/1.2 var(--h); } .card p{ margin:0 0 12px; color:var(--muted); }
  .row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .msg{ margin-top:12px; font-size:14px; } .muted{ color:var(--muted); } .small{ font-size:12.5px; }
  a{ color:var(--ink); }
  [hidden]{ display:none!important; }
  .pill{ display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; background:var(--cream); } .pill.ok{ background:var(--pill-ok); color:var(--ok);} .pill.warn{ background:var(--pill-warn); color:var(--warn);} .pill.bad{ background:var(--pill-bad); color:var(--bad);} .pill.gold{ background:var(--pill-gold); color:var(--pill-goldink); }
  .wrap{ overflow-x:hidden; border:1px solid var(--line); border-radius:16px; }
  table{ border-collapse:collapse; width:100%; font-size:13.5px; } th,td{ padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; vertical-align:top; } th{ font:500 11px/1.2 var(--b); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); background:var(--cream); position:sticky; top:0; }
  td.wrapcell{ white-space:normal; min-width:240px; }
  /* accueil */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; margin-bottom:26px; }
  .wcard{ border:1px solid var(--line); border-radius:18px; padding:20px 22px; display:grid; grid-template-columns:96px 1fr; gap:18px; align-items:center; cursor:pointer; transition:border-color .15s; } .wcard:hover{ border-color:var(--gold); }
  .wcard h3{ margin:0 0 4px; font:600 22px/1.15 var(--h); } .wcard .meta{ font-size:13px; color:var(--muted); line-height:1.5; }
  .gauge{ width:96px; height:96px; position:relative; } .gauge svg{ transform:rotate(-90deg); } .gauge b{ position:absolute; inset:0; display:grid; place-items:center; font:500 22px/1 var(--h); }
  .chem{ white-space:pre-wrap; line-height:1.7; }
  .chem p{ margin:0 0 10px; }
  .lights{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; }
  .light{ border:1px solid var(--line); border-radius:16px; padding:16px 18px; display:grid; grid-template-columns:18px 1fr; gap:12px; align-items:start; }
  .dot{ width:12px; height:12px; border-radius:50%; margin-top:5px; background:var(--line); box-shadow:0 0 0 4px var(--cream); }
  :root[data-theme="sombre"] header img, :root[data-theme="sombre"] .login img{ filter:invert(1) hue-rotate(180deg); } .dot.ok{ background:var(--ok); } .dot.ko{ background:var(--bad); } .dot.wait{ background:var(--gold); }
  .light b{ display:block; font:600 18px/1.2 var(--h); margin-bottom:2px; } .light span{ font-size:13px; color:var(--muted); word-break:break-word; }
  /* mariage : étapes */
  .layout{ display:grid; grid-template-columns:300px 1fr; gap:24px; } @media (max-width:860px){ .layout{ grid-template-columns:1fr; } }
  .steps{ border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .step{ display:grid; grid-template-columns:34px 1fr auto; gap:10px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .step:last-child{ border-bottom:0; } .step.on{ background:var(--cream); } .step.off{ color:var(--muted); }
  .step .n{ width:28px; height:28px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font:600 13px/1 var(--h); } .step.done .n{ background:var(--ok); color:var(--bg); border-color:var(--ok);} .step.on .n{ border-color:var(--gold); color:var(--gold); }
  .step .t{ font-size:14px; }
  .field{ margin-bottom:18px; } .field label{ display:block; font:600 15px/1.35 var(--b); margin-bottom:4px; } .field .q{ font:600 16px/1.4 var(--b); margin-bottom:6px; } .field .h{ font:400 12.5px/1.45 var(--b); font-style:italic; color:var(--muted); margin-top:6px; }
  .field .num{ font:500 11px/1 var(--b); letter-spacing:.14em; color:var(--gold); margin-bottom:4px; }
  .radios{ display:flex; gap:8px; flex-wrap:wrap; } .radios label{ font:400 14px/1 var(--b); padding:10px 16px; border:1px solid var(--line); border-radius:999px; cursor:pointer; } .radios input{ display:none; } .radios input:checked + span{ font-weight:600; } .radios label.sel{ background:var(--btn); color:var(--btnink); border-color:var(--btn); }
  .err{ color:var(--bad); font-size:13px; }
  .version{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:22px; }
  .diff{ margin:0; padding:0; list-style:none; font-size:12.5px; white-space:normal; } .diff li{ margin:2px 0; } .diff .from{ color:var(--muted); text-decoration:line-through; } .diff .to{ font-weight:600; }
  .who{ font-size:12px; color:var(--muted); margin-left:10px; }
  .res{ display:grid; gap:12px; } .res a{ font-weight:600; }
  /* fiches de la liste d'invités : jamais de table large */
  .fiche{ border:1px solid var(--line); border-left:4px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  .fiche.rouge{ border-left-color:#C0634B; } .fiche.vert{ border-left-color:var(--ok); } .fiche.orange{ border-left-color:var(--gold); } .fiche.gris{ border-left-color:var(--line); opacity:.6; }
  .fiche .top{ display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; } .fiche .top b{ font:600 17px/1.2 var(--h); } .fiche .top .num{ font-variant-numeric:tabular-nums; }
  .fiche .q{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:10px; }
  .fiche .q label{ display:block; font:500 10.5px/1 var(--b); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .fiche .q input, .fiche .q select{ min-height:38px; padding:7px 10px; font-size:14px; }
  .fiche .q .presence{ grid-column:1/-1; }
  .fiche .q .coches{ display:flex; flex-wrap:wrap; gap:6px; }
  .fiche .q label.coche{ display:inline-flex; align-items:center; gap:6px; margin:0; padding:6px 10px; border:1px solid var(--line); border-radius:999px; font:500 13px/1.2 var(--b); letter-spacing:0; text-transform:none; color:var(--ink); cursor:pointer; }
  .fiche .q label.coche input{ width:16px; height:16px; min-height:0; padding:0; margin:0; }
  .fiche .q label.coche:has(input:checked){ border-color:var(--gold); background:var(--cream); }
  .fiche .bas{ margin-top:8px; font-size:12.5px; color:var(--muted); } .fiche .bas .err{ display:block; } .fiche .an{ display:flex; gap:8px; align-items:flex-start; margin:4px 0; } .fiche .an input{ width:auto; min-height:0; margin-top:3px; }
  .fiche input[type=checkbox]{ width:18px; height:18px; min-height:0; margin:0; }
  .bloc{ margin-bottom:14px; } .bloc > .bh{ display:flex; align-items:center; gap:10px; cursor:pointer; padding:12px 16px; border:1px solid var(--line); border-radius:14px; background:var(--cream); } .bloc > .bh h2{ margin:0; font:500 18px/1.2 var(--h); letter-spacing:.06em; text-transform:uppercase; } .bloc > .bh .ch{ margin-left:auto; font-size:12px; color:var(--muted); } .bloc.ferme > .bc{ display:none; } .bloc > .bc{ padding-top:12px; }
  .kpi.lien{ cursor:pointer; } .kpi.lien:hover{ border-color:var(--gold); }
  .toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:14px 0; } .toolbar input, .toolbar select{ min-height:40px; } .toolbar .grp{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:12px; }
  .filtres{ display:flex; flex-wrap:wrap; gap:6px; } .filtres button{ min-height:34px; padding:6px 12px; }
  button.petit{ min-height:32px; padding:6px 12px; font-size:11px; }
  th,td{ white-space:normal; }
  @media (max-width:860px){
    header{ padding:12px 16px; } header h1{ font-size:19px; } main{ padding:16px 16px 50px; } nav{ display:flex; flex-wrap:wrap; gap:6px; } nav a{ margin:0; padding:8px 12px; }
    .layout{ grid-template-columns:1fr; } .steps{ display:flex; overflow-x:auto; } .step{ border-bottom:0; border-right:1px solid var(--line); min-width:150px; grid-template-columns:28px 1fr; } .step > div:last-child{ grid-column:1 / span 2; }
    .kpis{ grid-template-columns:repeat(2,1fr); } .kpi b{ font-size:26px; }
    table.resp thead{ display:none; } table.resp tr{ display:block; border-bottom:1px solid var(--line); padding:6px 0; } table.resp td{ display:block; border:0; padding:3px 12px; } table.resp td::before{ content:attr(data-l); display:block; font:500 10.5px/1.4 var(--b); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); } table.resp td:empty{ display:none; }
    .wcard{ grid-template-columns:80px 1fr; } .gauge{ width:80px; height:80px; } .gauge svg{ width:80px; height:80px; }
    .fiche .q{ grid-template-columns:repeat(2,1fr); }
  }
  .kpi{ border:1px solid var(--line); border-radius:16px; padding:16px 18px; } .kpi b{ display:block; font:500 34px/1 var(--h); font-variant-numeric:tabular-nums; } .kpi span{ font-size:12.5px; color:var(--muted); }
</style>

<body>
<header>
  <div class="marque"><img class="logo logo-noir" src="/img/logo-noir.png" alt="Yes I Do"><img class="logo logo-blanc" src="/img/logo-blanc.png" alt="Yes I Do"></div>
  <div class="moi" id="moi" hidden><span id="avatar"></span><div class="salut"><small id="ladate"></small><b id="who"></b></div></div>
  <nav id="nav" hidden><a href="#/" data-v="accueil" title="Accueil" aria-label="Accueil"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7v9H4z"/></svg></a><a href="#/nouveau" data-v="nouveau" title="Créer un mariage" aria-label="Créer un mariage"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a><a href="#/guide" data-v="guide" title="Guide et ressources" aria-label="Guide et ressources"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M5 16a4 4 0 0 1 4-4h10"/></svg></a><a href="#/reglages" data-v="reglages" title="Réglages" aria-label="Réglages"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></a><a href="#" id="bascule" title="Clair ou sombre" aria-label="Clair ou sombre"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14A8 8 0 1 1 10 4a6.5 6.5 0 0 0 10 10z"/></svg></a><a href="#" id="logout" title="Se déconnecter" aria-label="Se déconnecter"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg></a><span class="version" id="ver" hidden></span></nav>
</header>
<main>
  <div class="login ecran" id="login">
    <img class="photo" id="lphoto" src="/img/regis-grand.jpg" alt="">
    <div class="voilage"></div>
    <div class="bulle"><img src="/img/logo-blanc.png" alt="Yes I Do"></div>
    <div class="bas">
      <h2 id="lnom">Régis</h2>
      <p style="margin:0">Accès réservé à l'équipe Yes I Do.</p>
      <div class="profils"><button type="button" data-prof="Régis" class="on"><img src="/img/regis.jpg" alt="">Régis</button><button type="button" data-prof="Cécilia"><img src="/img/cess.jpg" alt="">Cécilia</button><button type="button" data-prof="">Autre</button></div>
      <input type="text" id="prenom" placeholder="Prénom" autocomplete="username" value="Régis" hidden>
      <input type="password" id="pw" placeholder="Mot de passe" autocomplete="current-password">
      <button id="go">Entrer</button>
      <p class="small" style="margin:0">La connexion par empreinte ou Face ID arrive avec la prochaine version.</p>
      <div class="msg" id="lmsg"></div>
    </div>
  </div>
  <div id="view" hidden></div>
  <p class="pied" id="pied" hidden>Un souci sur cet écran ? <a data-souci href="#">Dites le nous</a></p>
  <div class="voile" id="souci" hidden><div class="feuille"><div class="grip"></div><h3>Un souci sur cet écran ?</h3><p class="muted" style="margin:6px 0 14px;font-size:13px">Une phrase suffit. Nous joignons nous mêmes l'écran, la version et votre appareil.</p><textarea id="souci-txt" placeholder="Par exemple : le bouton Valider ne réagit pas sur la fiche de Hélène"></textarea><div class="row" style="margin-top:14px"><button class="ghost" data-fermer type="button" style="flex:1">Annuler</button><button id="souci-go" type="button" style="flex:2">Envoyer</button></div><div class="msg" id="souci-msg"></div></div></div>
</main>
<script>
(function(){
  var TOKEN = "", MOI = {}; try { TOKEN = sessionStorage.getItem("yid_token") || ""; MOI = JSON.parse(sessionStorage.getItem("yid_moi") || "{}"); } catch(e){}
  /* thème : le choix de la personne (navigateur) prime, sinon le thème par défaut de l'outil, sinon clair */
  function monTheme(){ try { return localStorage.getItem("yid_theme") || ""; } catch(e){ return ""; } }
  function applyTheme(){ var t = monTheme() || MOI.theme || "clair"; document.documentElement.setAttribute("data-theme", t === "sombre" ? "sombre" : "clair"); }
  applyTheme();
  var $ = function(id){ return document.getElementById(id); };
  var V = $("view");
  function api(action, payload, w){
    return fetch("/api/forms?action=" + action + (w ? "&w=" + encodeURIComponent(w) : ""), { method:"POST", headers:{ "Content-Type":"application/json", "X-Admin-Token": TOKEN }, body: JSON.stringify(payload || {}) })
      .then(function(r){ return r.text().then(function(t){ var j; try { j = JSON.parse(t); } catch (e) { throw new Error(r.status === 504 || /timed out|An error o/i.test(t) ? "Le serveur n'a pas répondu à temps. Ce qui a déjà été enregistré l'est bien : rechargez la page pour vérifier, puis réessayez si besoin." : "Réponse inattendue du serveur (" + r.status + "). Rechargez la page."); } return j; }).then(function(j){ if (r.status === 401) { logout("Session expirée, reconnectez vous."); throw new Error("Session expirée"); } if (!j.ok && r.status !== 422) throw new Error(j.detail || j.error || "Erreur"); return j; }); });
  }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]; }); }
  function fmt(iso){ if (!iso) return ""; var d = new Date(String(iso).replace(" ", "T")); if (isNaN(d)) return String(iso).slice(0,16); return d.toLocaleDateString("fr-FR") + " " + d.toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" }); }
  function fdate(d){ if (!d) return ""; var p = String(d).slice(0,10).split("-"); return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : d; }
  function pill(t, c){ return t ? '<span class="pill ' + (c || "") + '">' + esc(t) + '</span>' : ""; }
  function statutClass(s){ return s === "En préparation" || s === "Signé" ? "ok" : s === "Prospect" ? "warn" : s === "Test" ? "gold" : ""; }
  function download(name, csv){ var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv;charset=utf-8" })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  function gauge(p){ var r = 40, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, p)) / 100); return '<div class="gauge"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="' + r + '" fill="none" style="stroke:var(--line)" stroke-width="7"/><circle cx="48" cy="48" r="' + r + '" fill="none" style="stroke:var(--gold)" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '"/></svg><b>' + p + '%</b></div>'; }

  /* ---------- connexion ---------- */
  function enter(){
    var pw = $("pw").value, prenom = $("prenom").value.trim(); $("lmsg").textContent = "";
    fetch("/api/forms?action=admin-login", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ password: pw, prenom: prenom }) })
      .then(function(r){ return r.json(); })
      .then(function(j){ if (!j.ok) throw new Error(j.error === "password" ? (prenom ? "Prénom ou mot de passe refusé" : "Mot de passe refusé") : (j.detail || "Connexion impossible")); TOKEN = j.token; MOI = { nom: j.nom, role: j.role, version: j.version, equipe: j.equipe, theme: j.theme }; applyTheme(); try{ sessionStorage.setItem("yid_token", TOKEN); sessionStorage.setItem("yid_moi", JSON.stringify(MOI)); }catch(e){} opened(); })
      .catch(function(e){ $("lmsg").textContent = e.message; });
  }
  function photoDe(nom){ return /r[ée]gis/i.test(nom || "") ? "/img/regis.jpg" : /c[ée]cilia|cess/i.test(nom || "") ? "/img/cess.jpg" : ""; }
  function avatarHtml(nom, taille){ var p = photoDe(nom), t = taille || 42; return p ? '<img class="avatar" src="' + p + '" alt="' + esc(nom) + '" style="width:' + t + 'px;height:' + t + 'px">' : '<span class="avatar" style="width:' + t + 'px;height:' + t + 'px">' + esc(String(nom || "?").charAt(0).toUpperCase()) + '</span>'; }

  /* ---------- routeur ---------- */
  function route(){
    if (!TOKEN) return;

    document.querySelectorAll("#nav a[data-v]").forEach(function(a){ a.classList.toggle("on", (h === "#/" && a.dataset.v === "accueil") || h.indexOf("#/" + a.dataset.v) === 0); });
    var m = h.match(/^#\/m\/([A-Za-z0-9]+)(?:\/(\d|journal|espace))?/);
    if (m) return mariage(m[1].toUpperCase(), m[2] === "journal" || m[2] === "espace" ? m[2] : (m[2] ? +m[2] : null));
    if (h.indexOf("#/nouveau") === 0) return cadrage(null);
    if (h.indexOf("#/guide") === 0) return guide();
    if (h.indexOf("#/reglages") === 0) return MOI.role === "administrateur" ? reglages() : accueil();

  }
  window.addEventListener("hashchange", route);

  function light(id, st){ $("d-" + id).className = "dot " + (st.ok ? "ok" : "ko"); $("t-" + id).textContent = st.detail || ""; if (st.url && st.ok) $("t-" + id).innerHTML += ' <a href="' + esc(st.url) + '" target="_blank" rel="noopener">ouvrir</a>'; }

    $("cmsg").textContent = ""; $("check").disabled = true;

      .catch(function(e){ $("cmsg").textContent = e.message; }).then(function(){ if ($("check")) $("check").disabled = false; });

  /* ---------- journal : une table lisible, avec la différence avant / après ---------- */

    if (!keys.length) return "";
    return '<ul class="diff">' + keys.map(function(k){ var va = a[k], vb = b[k]; var f = function(x){ return x === undefined || x === null || x === "" ? "vide" : (typeof x === "object" ? JSON.stringify(x) : String(x)); };
      return "<li><b>" + esc(LIB[k] || k) + "</b> : " + (k in a && k in b ? '<span class="from">' + esc(f(va)) + '</span> <span class="to">' + esc(f(vb)) + '</span>' : k in b ? '<span class="to">' + esc(f(vb)) + '</span>' : '<span class="from">' + esc(f(va)) + '</span>') + "</li>"; }).join("") + '</ul>';
  }

  function lireFichier(file){
    return new Promise(function(ok, ko){
      var fr = new FileReader();
      fr.onerror = function(){ ko(new Error("Lecture impossible : " + file.name)); };
      fr.onload = function(){
        /* octets lus tels quels (latin1 = 1 octet par caractère) ; les photos sont retirées avant l'envoi, elles n'ont aucun usage */
        var u8 = new Uint8Array(fr.result), txt = ""; for (var c = 0; c < u8.length; c += 8192) txt += String.fromCharCode.apply(null, u8.subarray(c, c + 8192));
        if (/\.xlsx$/i.test(file.name)) { ok({ name: file.name, b64: btoa(txt) }); return; }   /* classeur : octets tels quels */
        var lines = txt.split(/\r\n|\n|\r/), out = [], skip = false;
        for (var i = 0; i < lines.length; i++) { var l = lines[i]; if (/^PHOTO[;:]/i.test(l) || /^LOGO[;:]/i.test(l)) { skip = true; continue; } if (skip && (l.charAt(0) === " " || l.charAt(0) === "\t" || (/^[A-Za-z0-9\/+=]+$/.test(l) && l.length > 60))) continue; skip = false; out.push(l); }
        var clean = out.join("\r\n"), bin = ""; for (var k = 0; k < clean.length; k++) bin += String.fromCharCode(clean.charCodeAt(k) & 255);
        ok({ name: file.name, b64: btoa(bin) });
      };
      fr.readAsArrayBuffer(file);
    });

    $("doImport").onclick = function(){ $("imsg").textContent = "Import en cours"; api("admin-import", { csv: $("csv").value }, W).then(function(j){ $("imsg").textContent = j.count + " foyer(s), dont " + j.created + " nouveau(x). Liens personnels téléchargés."; download("Liens personnels " + W + ".csv", j.csv); load(); }).catch(function(e){ $("imsg").textContent = e.message; }); };

    $("sync").onclick = function(){ api("admin-sync", {}, W).then(function(j){ $("smsg2").textContent = j.skipped ? "Excel non branché pour ce mariage." : (j.ok ? "Excel à jour." : j.pending + " écriture(s) en attente."); }).catch(function(e){ $("smsg2").textContent = e.message; }); };
    load();
  }

  if (TOKEN) opened();
})();
</script>
</body>
</html>
