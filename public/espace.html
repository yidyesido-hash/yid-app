<style>
  :root{ --ink:#141210; --muted:#6B655E; --line:#E9E4DC; --cream:#FAF7F2; --gold:#B8956A; --goldink:#7d5f3b;
         --ok:#3F6B4E; --okbg:#E9F1EB; --bad:#9B3B2E; --badbg:#F6E7E4; --warn:#9B6A2E; --warnbg:#F7EEDF; --grey:#9A938A; --greybg:#F1EFEC;
         --h:"Cormorant Garamond",Georgia,serif; --b:"Inter",system-ui,sans-serif; --bg:#fff; }
  *{ box-sizing:border-box }
  html,body{ margin:0; background:var(--bg); color:var(--ink); font:400 15px/1.6 var(--b); -webkit-font-smoothing:antialiased; }
  body.transparent{ --bg:transparent; }
  body.transparent .surface{ background:rgba(255,255,255,.94); }
  .page{ max-width:980px; margin:0 auto; padding:40px 20px 80px; }
  header.top{ text-align:center; padding:10px 0 28px; }
  header.top img{ height:64px; width:auto; }
  .eyebrow{ font:500 11px/1 var(--b); letter-spacing:.28em; text-transform:uppercase; color:var(--gold); margin:22px 0 12px; }
  h1{ margin:0; font:500 clamp(30px,6vw,44px)/1.1 var(--h); letter-spacing:.14em; text-transform:uppercase; }
  .sub{ margin-top:12px; color:var(--muted); font-size:14px; letter-spacing:.04em; }
  nav.tabs{ display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin:30px 0 34px; }
  nav.tabs button{ min-height:42px; padding:10px 20px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--ink); font:500 11px/1 var(--b); letter-spacing:.16em; text-transform:uppercase; cursor:pointer; }
  nav.tabs button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  h2{ margin:0 0 6px; font:500 26px/1.15 var(--h); letter-spacing:.1em; text-transform:uppercase; text-align:center; }
  .intro{ text-align:center; color:var(--muted); max-width:620px; margin:0 auto 28px; }
  .surface{ background:var(--bg); border:1px solid var(--line); border-radius:22px; padding:26px; margin-bottom:18px; }
  .muted{ color:var(--muted); } .small{ font-size:13px; }
  [hidden]{ display:none!important; }
  button.pill, a.pill{ display:inline-flex; align-items:center; justify-content:center; min-height:42px; padding:10px 22px; border-radius:999px; border:1px solid var(--ink); background:var(--ink); color:#fff; font:500 11px/1 var(--b); letter-spacing:.16em; text-transform:uppercase; cursor:pointer; text-decoration:none; }
  button.pill.light{ background:transparent; color:var(--ink); border-color:var(--line); }
  button.pill.light:hover{ border-color:var(--ink); }
  button[disabled]{ opacity:.5; cursor:default; }
  /* parcours */
  .frise{ position:relative; display:grid; gap:0; }
  .etape{ display:grid; grid-template-columns:52px 1fr; gap:16px; padding:0 0 22px; position:relative; cursor:pointer; }
  .etape:not(:last-child)::before{ content:""; position:absolute; left:25px; top:48px; bottom:0; width:1px; background:var(--line); }
  .etape .rond{ width:50px; height:50px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font:500 20px/1 var(--h); background:var(--bg); position:relative; z-index:1; }
  .etape.faite .rond{ background:var(--ok); border-color:var(--ok); color:#fff; }
  .etape.encours .rond{ border-color:var(--gold); color:var(--goldink); box-shadow:0 0 0 6px var(--cream); }
  .etape .t{ font:600 21px/1.2 var(--h); padding-top:6px; }
  .etape.avenir .t{ color:var(--muted); }
  .etape .s{ font:500 10.5px/1 var(--b); letter-spacing:.18em; text-transform:uppercase; margin-top:6px; color:var(--muted); }
  .etape.faite .s{ color:var(--ok); } .etape.encours .s{ color:var(--gold); }
  .etape .d{ color:var(--muted); margin-top:10px; font-size:14px; max-width:520px; }
  .faits{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; }
  .fait{ border:1px solid var(--line); border-radius:18px; padding:16px 18px; }
  .fait span{ display:block; font:500 10.5px/1.3 var(--b); letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .fait b{ font:500 22px/1.2 var(--h); }
  /* liste */
  .synthese{ display:grid; grid-template-columns:200px 1fr; gap:26px; align-items:center; }
  @media (max-width:720px){ .synthese{ grid-template-columns:1fr; justify-items:center; } }
  .anneau{ position:relative; width:180px; height:180px; }
  .anneau svg{ transform:rotate(-90deg); }
  .anneau .c{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; }
  .anneau .c b{ display:block; font:500 40px/1 var(--h); }
  .anneau .c span{ font:500 10.5px/1.4 var(--b); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .chiffres{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; width:100%; }
  .chiffre{ border:1px solid var(--line); border-radius:18px; padding:14px 16px; cursor:pointer; background:var(--bg); text-align:left; font:inherit; color:inherit; }
  .chiffre:hover{ border-color:var(--gold); }
  .chiffre b{ display:block; font:500 30px/1.1 var(--h); }
  .chiffre span{ font:500 10.5px/1.4 var(--b); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .chiffre em{ display:block; font-style:normal; font-size:12.5px; color:var(--muted); margin-top:4px; }
  .barre{ height:6px; border-radius:999px; background:var(--greybg); overflow:hidden; margin-top:10px; }
  .barre i{ display:block; height:100%; background:var(--gold); border-radius:999px; }
  .barre i.trop{ background:var(--bad); }
  .cotes{ display:flex; height:10px; border-radius:999px; overflow:hidden; background:var(--greybg); margin:10px 0 6px; }
  .cotes i{ display:block; height:100%; }
  .legende{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; font-size:12.5px; color:var(--muted); margin:6px 0 18px; }
  .legende span::before{ content:""; display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:middle; background:var(--c); }
  details.regles{ border:1px solid var(--line); border-radius:18px; padding:16px 20px; margin-bottom:18px; background:var(--cream); }
  details.regles summary{ cursor:pointer; list-style:none; font:500 11px/1 var(--b); letter-spacing:.22em; text-transform:uppercase; color:var(--goldink); text-align:center; }
  details.regles summary::-webkit-details-marker{ display:none; }
  details.regles ol{ margin:16px 0 0; padding-left:22px; } details.regles li{ margin-bottom:8px; }
  .filtres{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:12px; }
  .filtres button{ min-height:36px; padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--bg); font:500 12px/1 var(--b); color:var(--ink); cursor:pointer; }
  .filtres button.on{ border-color:var(--ink); background:var(--ink); color:#fff; }
  .recherche{ display:grid; grid-template-columns:1fr auto; gap:10px; margin-bottom:16px; }
  input, select{ width:100%; min-height:46px; padding:11px 14px; border:1px solid var(--line); border-radius:14px; font:400 15px/1.4 var(--b); color:var(--ink); background:#fff; }
  .bandeau{ text-align:center; font-size:13.5px; color:var(--goldink); background:var(--cream); border-radius:14px; padding:12px 16px; margin-bottom:16px; }
  .invites{ display:grid; gap:12px; }
  .inv{ border:1px solid var(--line); border-left:4px solid var(--c); border-radius:18px; padding:16px 18px; background:var(--bg); }
  .inv.rouge{ --c:var(--bad); } .inv.vert{ --c:var(--ok); } .inv.orange{ --c:var(--gold); } .inv.gris{ --c:#CFC9C1; opacity:.75; }
  .inv .tete{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:6px 14px; cursor:pointer; }
  .inv .nom{ font:600 20px/1.2 var(--h); }
  .inv .num{ font-size:13px; color:var(--muted); letter-spacing:.02em; }
  .etat{ display:inline-block; padding:4px 11px; border-radius:999px; font:500 11px/1.2 var(--b); letter-spacing:.06em; }
  .etat.rouge{ background:var(--badbg); color:var(--bad); } .etat.vert{ background:var(--okbg); color:var(--ok); } .etat.orange{ background:var(--warnbg); color:var(--warn); } .etat.gris{ background:var(--greybg); color:var(--grey); }
  .inv .resume{ font-size:13.5px; color:var(--muted); margin-top:6px; }
  .inv .manque{ font-size:13px; color:var(--bad); margin-top:6px; }
  .form{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 14px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }
  @media (max-width:560px){ .form{ grid-template-columns:1fr; } }
  .form label{ display:block; font:500 10.5px/1.3 var(--b); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .form .large{ grid-column:1/-1; }
  .coches{ display:flex; flex-wrap:wrap; gap:8px; }
  .coche{ display:inline-flex; align-items:center; gap:8px; padding:8px 13px; border:1px solid var(--line); border-radius:999px; font-size:13.5px; cursor:pointer; }
  .coche input{ width:16px; height:16px; min-height:0; margin:0; }
  .form label.coche{ display:inline-flex; margin:0; font:400 13.5px/1.2 var(--b); letter-spacing:0; text-transform:none; color:var(--ink); }
  .coche:has(input:checked){ border-color:var(--gold); background:var(--cream); }
  .actions{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
  .lienretirer{ background:none; border:0; padding:0; color:var(--muted); font-size:13px; text-decoration:underline; cursor:pointer; }
  .msg{ font-size:13px; color:var(--muted); }
  .msg.err{ color:var(--bad); }
  /* contacts */
  .depot{ display:grid; gap:14px; max-width:560px; margin:0 auto; }
  .choix{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .choix label{ display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border:1px solid var(--line); border-radius:999px; cursor:pointer; }
  .choix label:has(input:checked){ border-color:var(--ink); }
  .choix input{ width:16px; height:16px; min-height:0; margin:0; }
  .recu{ text-align:center; }
  .recu b{ font:500 26px/1.2 var(--h); }
  footer{ text-align:center; color:var(--muted); font-size:12px; letter-spacing:.08em; margin-top:40px; }
  .vide{ text-align:center; color:var(--muted); padding:30px 10px; }
  .direct{ display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
  .direct::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--ok); }
</style>

<body>
<div class="page">
  <div class="hero"><img class="ph" src="/img/p2186.jpg" alt=""><div class="voile"></div><img class="logo" src="/img/logo-blanc.png" alt="Yes I Do"></div>
  <header class="top">
    <img src="/img/logo-noir.png" alt="Yes I Do" style="height:56px">
    <div class="eyebrow">Votre espace</div>
    <h1 id="prenoms">&nbsp;</h1>
    <div class="sub" id="sous"></div>
  </header>
  <div id="erreur" class="surface vide" hidden></div>
  <div id="app" hidden>
    <nav class="tabs" id="tabs">
      <button data-t="parcours" class="on">Parcours</button>
      <button data-t="liste">Votre liste</button>
      <button data-t="contacts">Envoyer</button>
      <button class="joindre" id="joindre" type="button" aria-label="Nous joindre"><img src="/img/cess.jpg" alt=""><img src="/img/regis.jpg" alt=""></button>
    </nav>
    <section id="t-parcours"></section>
    <section id="t-liste" hidden></section>
    <section id="t-contacts" hidden></section>
  </div>
  <footer>Yes I Do · <span class="direct">mis à jour en direct</span><span class="souci">Une difficulté sur cette page ? <a href="#" id="souci">Dites le nous</a></span></footer>
  <div class="voile-c" id="contact" hidden><div class="feuille"><div class="grip"></div><h3>Nous joindre</h3><p class="muted small" style="margin:4px 0 6px">Vos interlocuteurs pour ce mariage, en ligne directe.</p><div id="equipe"></div><div style="text-align:center;margin-top:12px"><button class="pill light" type="button" id="fermer">Fermer</button></div></div></div>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var J = (location.hash.match(/[#&]?([A-Za-z0-9_-]{24,64})/) || [])[1] || new URLSearchParams(location.search).get("j") || "";
  if (new URLSearchParams(location.search).get("fond") === "transparent") document.body.classList.add("transparent");
  var D = null, ONGLET = "parcours", FILTRE = "tous", COTE = "", OUVERT = {}, OCCUPE = false;
  var MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }
  function dateLongue(d){ if (!d) return ""; var p = String(d).slice(0,10).split("-"); return p.length === 3 ? (+p[2]) + " " + MOIS[+p[1] - 1] + " " + p[0] : d; }
  function api(action, payload){
    return fetch("/api/forms?action=" + action, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ j: J }, payload || {})) })
      .then(function(r){ return r.text().then(function(t){ var j; try { j = JSON.parse(t); } catch(e){ throw new Error("Le service a mis trop de temps à répondre. Réessayez dans un instant."); } if (!j.ok) throw new Error(j.detail || "Une erreur est survenue."); return j; }); });
  }
  function couleur(e){ return e === "complet" ? "vert" : e === "à compléter" ? "rouge" : e === "avec Yes I Do" ? "orange" : "gris"; }
  function libelleEtat(e){ return e === "complet" ? "Complet" : e === "à compléter" ? "À compléter" : e === "avec Yes I Do" ? "À voir avec Yes I Do" : "Retiré"; }

  /* ---------- parcours ---------- */
  var PIDX = 0;
  var QC = {
    "côté": { q: "De quel côté est %s ?", k: "cote", o: function(){ return D.cotes; } },
    "lien": { q: "Quel est votre lien avec %s ?", k: "lien", o: function(){ return ["Père / Mère", "Frère / Sœur", "Témoin", "Cousin / Cousine", "Oncle / Tante", "Ami(e) proche", "Ami(e)", "Collègue"]; } },
    "invitation": { q: "%s viendra t il accompagné ?", k: "invitation", o: function(){ return D.invitations; } },
    "enfants": { q: "Combien d'enfants viendront avec %s ?", k: "nb_enfants", o: function(){ return ["0", "1", "2", "3", "4"]; } },
    "hébergement": { q: "Où logera %s ?", k: "hebergement", o: function(){ return D.mariage.lieux || []; } }
  };
  function precision(c, k){
    var mq = c.manque || [], q0 = null; for (var x = 0; x < mq.length; x++) if (QC[mq[x]]) { q0 = QC[mq[x]]; break; }
    var prenom = (c.prenom || String(c.nom || "").split(" ")[0] || "cet invité");
    var peut = mq.indexOf("côté") < 0 && mq.indexOf("lien") < 0;
    return '<div class="sc ' + YID.ton(k + 4) + '"><div class="k">Une précision</div><div class="nomc" style="margin-top:8px">' + esc(c.nom || "Sans nom") + '</div>' +
      (q0 ? '<div style="font-size:14px;margin-top:8px;opacity:.82">' + esc(q0.q.replace("%s", prenom)) + '</div><div style="flex:1"></div><div style="display:flex;gap:6px;flex-wrap:wrap">' + q0.o().map(function(v){ return '<button type="button" class="ch" data-pc="' + c.id + '" data-k="' + q0.k + '" data-v="' + esc(v) + '">' + esc(v) + '</button>'; }).join("") + '</div>' : '<div style="font-size:14px;margin-top:8px;opacity:.82">À préciser : ' + esc(mq.join(", ")) + '</div><div style="flex:1"></div>') +
      (peut ? '<button type="button" class="lienbas" data-pd="' + c.id + '" style="margin-top:12px;align-self:flex-start">Je ne sais pas, demandez lui</button>' : '') + '</div>';
  }
  function parcours(){
    var m = D.mariage, ouverte = null;
    var t = D.tuiles, tot = (t.recues && t.recues.n) || 0, ok = (t.completees && t.completees.n) || 0, pc = tot ? Math.round(ok / tot * 100) : 0;
    var rouges = D.contacts.filter(function(c){ return c.etat === "à compléter"; });
    var C = 2 * Math.PI * 31, anneauS = '<svg width="76" height="76" viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="31" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"/><circle cx="38" cy="38" r="31" fill="none" stroke="#E4CDA4" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - pc / 100)).toFixed(1) + '" transform="rotate(-90 38 38)"/><text x="38" y="44" text-anchor="middle" font-family="Cormorant Garamond" font-size="21" fill="#F6EEDF">' + pc + '%</text></svg>';
    var tete = '<div class="sombre-c">' + anneauS + '<div style="flex:1;min-width:0"><div class="serif-c">' + (rouges.length ? "Votre liste est presque prête" : tot ? "Votre liste est complète" : "Votre liste vous attend") + '</div><div class="petit-c">' + ok + ' invité(s) complet(s) sur ' + tot + (rouges.length ? '. Plus que ' + rouges.length + ' précision(s).' : '.') + '</div></div></div>';
    if (rouges.length) {
      tete += '<div class="metap" style="margin-top:22px"><span class="k-c">Une précision, s\'il vous plaît</span><span id="pcnt" class="muted small"></span></div><div class="pile2" id="ppile" style="height:300px">' + rouges.map(function(c, k){ return precision(c, k); }).join("") + '</div><div class="dots" id="pdots"></div><div style="margin-top:14px"><button type="button" class="cta encre" id="psuiv"><span>Suivante</span></button></div><div class="msg" id="pmsg" style="text-align:center;margin-top:8px"></div>';
    }
    var html = tete + '<h2 style="margin-top:38px">Votre parcours</h2><p class="intro">Les grandes étapes de votre mariage avec Yes I Do. L\'étape en cours est ouverte, touchez les autres pour les lire.</p><div class="surface"><div class="frise">' +
      D.parcours.map(function(e, i){
        var faite = !!m.etapes[e.n], encours = !faite && (m.etape === e.n || (m.etape === 5 && e.n === 6)), cls = faite ? "faite" : encours ? "encours" : "avenir";
        var ouvert = OUVERT["e" + e.n] !== undefined ? OUVERT["e" + e.n] : encours;
        return '<div class="etape ' + cls + '" data-e="' + e.n + '"><div class="rond">' + (faite ? "✓" : (i + 1)) + '</div><div><div class="t">' + esc(e.t) + '</div><div class="s">' + (faite ? "Terminée" : encours ? "En cours" : "À venir") + '</div>' + (ouvert ? '<div class="d">' + esc(e.d) + '</div>' : '') + '</div></div>';
      }).join("") + '</div></div>';
    var faits = [["Date", dateLongue(m.date)], ["Lieu", m.lieu], ["Invités prévus", m.prevu], ["Au plus", m.plafond], ["Liste à remettre le", dateLongue(m.remise)], ["Liste close le", dateLongue(m.arret)]];
    if (m.periodes && m.periodes.length) faits.push(["Les moments", m.periodes.join(" · ")]);
    faits.push(["Enfants", m.enfants === "sans" ? "Mariage sans enfants" : m.enfants === "mixte" ? (m.consigne_enfants || "Selon les familles") : "Bienvenus"]);
    if (m.hebergement !== "aucun") faits.push(["Hébergement", (m.lieux || []).filter(function(x){ return x !== "Par leurs propres moyens"; }).join(" · ") + (m.hebergement === "partie" ? " (une partie des invités)" : "")]);
    html += '<h2 style="margin-top:34px">Le cadre de votre mariage</h2><p class="intro">Ce que nous avons posé ensemble lors de notre premier échange.</p><div class="faits">' + faits.filter(function(f){ return f[1]; }).map(function(f){ return '<div class="fait"><span>' + esc(f[0]) + '</span><b>' + esc(f[1]) + '</b></div>'; }).join("") + '</div>';
    $("t-parcours").innerHTML = html;
    if ($("ppile")) {
      var P = YID.pileActive = YID.pile($("ppile"), { index: PIDX, onChange: function(i, n){ PIDX = i; $("pcnt").textContent = (i + 1) + " sur " + n; YID.points($("pdots"), i, n); } });
      $("psuiv").onclick = function(){ if (P.index() < P.total - 1) P.suivante(); else P.secoue(); };
      $("t-parcours").querySelectorAll("[data-pc]").forEach(function(b){ b.onclick = function(){ var ch = {}; ch[b.dataset.k] = b.dataset.k === "nb_enfants" ? +b.dataset.v : b.dataset.v; b.classList.add("sel"); OCCUPE = true; $("pmsg").textContent = "Enregistrement"; api("espace-qualifier", { id: +b.dataset.pc, champs: ch }).then(function(r){ D = r; OCCUPE = false; $("pmsg").textContent = ""; parcours(); }).catch(function(e){ OCCUPE = false; $("pmsg").textContent = e.message; }); }; });

  }

  /* ---------- liste ---------- */
  function anneau(p){ var r = 78, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(1, p))); return '<svg width="180" height="180" viewBox="0 0 180 180"><circle cx="90" cy="90" r="' + r + '" fill="none" stroke="#F1EFEC" stroke-width="10"/><circle cx="90" cy="90" r="' + r + '" fill="none" stroke="' + (p >= 1 ? "#3F6B4E" : "#B8956A") + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '"/></svg>'; }
  function barre(n, sur){ if (!sur) return ""; var p = Math.min(100, Math.round(n / sur * 100)); return '<div class="barre"><i class="' + (n > sur ? "trop" : "") + '" style="width:' + p + '%"></i></div>'; }
  var FILTRES = {

  };
  function listeVue(){

  function invites(){

  /* ---------- envoyer des contacts ---------- */
  function contacts(){

    $("t-contacts").innerHTML = '<h2>Envoyer des contacts</h2><p class="intro">Un oubli, un ajout, un doute ? Envoyez nous les contacts tels qu\'ils sont dans votre téléphone. Notre outil reconnaît les doublons, vous ne risquez rien.</p>' +
      '<div class="surface"><div class="depot"><div class="choix"><label><input type="radio" name="cote" value="Épouse">Côté épouse</label><label><input type="radio" name="cote" value="Époux">Côté époux</label></div><div class="choix"><label><input type="radio" name="dest" value="liste" checked>Pour votre liste</label><label><input type="radio" name="dest" value="attente">Pour votre liste d\'attente</label></div>' +
      '<label class="fichier"><input type="file" id="fichiers" multiple accept=".vcf,.csv,.xlsx,text/vcard,text/x-vcard" hidden><span class="pill light">Choisir vos fichiers</span><span class="muted small" id="fnoms">Aucun fichier choisi</span></label>' +

  /* ---------- navigation et direct ---------- */
